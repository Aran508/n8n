steps:
- tool_change:
    arm: arm3
    tool: vacuum
- tool_change:
    arm: arm1
    tool: tweezers
- tool_change:
    arm: arm2
    tool: gripper_B
- tool_change:
    arm: arm4
    tool: iron
- pick:
    arm: arm3
    item: board
    from: kit.board
  note: Perfboard from the kit drawer into the flip fixture
- place:
    arm: arm3
    to: watch.board
- pick:
    arm: arm3
    item: esp
    from: side.part
  note: ESP32-C3 SuperMini, headers pre-soldered
- place:
    arm: arm3
    to: watch.esp
    into: board
    press: 1
- pick:
    arm: arm2
    item: b1
    from: cup_a
  note: Buttons go in along the bottom edge
- place:
    arm: arm2
    to: watch.b1
    into: board
    press: 1
- pick:
    arm: arm2
    item: b2
    from: cup_a
- place:
    arm: arm2
    to: watch.b2
    into: board
    press: 1
- pick:
    arm: arm2
    item: b3
    from: cup_a
- place:
    arm: arm2
    to: watch.b3
    into: board
    press: 1
- pick:
    arm: arm1
    item: r1
    from: cup_b
  note: 'Small parts with tweezers: 10k pull-up'
- place:
    arm: arm1
    to: watch.r1
    into: board
    press: 1
- pick:
    arm: arm1
    item: q1
    from: cup_b
  note: P-MOSFET power switch
- place:
    arm: arm1
    to: watch.q1
    into: board
    press: 1
- pick:
    arm: arm1
    item: hdr
    from: cup_b
  note: 4-pin socket for the OLED
- place:
    arm: arm1
    to: watch.hdr
    into: board
    press: 1
- pick:
    arm: arm1
    item: jst
    from: cup_b
  note: Vertical JST socket for the battery
- place:
    arm: arm1
    to: watch.jst
    into: board
    press: 1
- pick:
    arm: arm3
    item: chg
    from: cup_c
  note: USB-C charger module, castellated pads
- place:
    arm: arm3
    to: watch.chg
    into: board
- solder:
    arm: arm4
    at:
    - watch.chg1
    - watch.chg2
    - watch.chg3
    - watch.chg4
    dwell: 0.6
  note: Iron solders the charger's 4 pads on top
- tool_change:
    arm: arm2
    tool: iron_B
  note: Holder swaps its gripper for the second iron
- flip:
    at: watch
  note: 'Flip: legs point up'
- solder:
    arm: arm4
    at:
    - watch.u.esp1
    - watch.u.esp2
    - watch.u.esp3
    - watch.u.esp4
    - watch.u.esp5
    - watch.u.esp6
    - watch.u.esp7
    - watch.u.esp8
    - watch.u.esp9
    - watch.u.esp10
    - watch.u.esp11
    - watch.u.esp12
    - watch.u.esp13
    - watch.u.esp14
    - watch.u.esp15
    - watch.u.esp16
    dwell: 0.5
  note: 'Underside joints: esp (16 legs, arm4)'
- solder:
    arm: arm2
    at:
    - watch.u.b11
    - watch.u.b12
    - watch.u.b13
    - watch.u.b14
    dwell: 0.5
  note: 'Underside joints: b1 (4 legs, arm2)'
- solder:
    arm: arm4
    at:
    - watch.u.q11
    - watch.u.q12
    - watch.u.q13
    dwell: 0.5
  note: 'Underside joints: q1 (3 legs, arm4)'
- solder:
    arm: arm2
    at:
    - watch.u.r11
    - watch.u.r12
    dwell: 0.5
  note: 'Underside joints: r1 (2 legs, arm2)'
- solder:
    arm: arm4
    at:
    - watch.u.b31
    - watch.u.b32
    - watch.u.b33
    - watch.u.b34
    dwell: 0.5
  note: 'Underside joints: b3 (4 legs, arm4)'
- solder:
    arm: arm2
    at:
    - watch.u.jst1
    - watch.u.jst2
    dwell: 0.5
  note: 'Underside joints: jst (2 legs, arm2)'
- solder:
    arm: arm2
    at:
    - watch.u.b21
    - watch.u.b22
    - watch.u.b23
    - watch.u.b24
    dwell: 0.5
  note: 'Underside joints: b2 (4 legs, arm2)'
- solder:
    arm: arm2
    at:
    - watch.u.hdr1
    - watch.u.hdr2
    - watch.u.hdr3
    - watch.u.hdr4
    dwell: 0.5
  note: 'Underside joints: hdr (4 legs, arm2)'
- trace:
    arm: arm2
    at: watch.u0
    path:
    - - -15.8
      - 16.5
    - - 15.8
      - 16.5
  note: 'Track: GND rail along the buttons (arm2)'
- trace:
    arm: arm4
    at: watch.u0
    path:
    - - -3.8
      - 3
    - - -3.8
      - -1.4
    - - -5.2
      - -1.4
  note: 'Track: OLED VCC/GND to the ESP 3V3/GND row (arm4)'
- trace:
    arm: arm4
    at: watch.u0
    path:
    - - 1.3
      - 3
    - - 1.3
      - -1.4
    - - 1.6
      - -1.4
  note: 'Track: OLED SDA to GPIO (arm4)'
- trace:
    arm: arm4
    at: watch.u0
    path:
    - - 3.8
      - 3
    - - 4.1
      - -1.4
  note: 'Track: OLED SCL to GPIO (arm4)'
- trace:
    arm: arm2
    at: watch.u0
    path:
    - - -8.2
      - 11.5
    - - -8.2
      - -1.4
    - - -9.0
      - -1.4
  note: 'Track: button 1 to GPIO (arm2)'
- trace:
    arm: arm2
    at: watch.u0
    path:
    - - 3.8
      - 11.5
    - - 6.5
      - 6
    - - 6.5
      - -1.4
  note: 'Track: button 2 to GPIO (arm2)'
- trace:
    arm: arm2
    at: watch.u0
    path:
    - - -10.2
      - 3
    - - 8.5
      - 3
  note: 'Track: pull-up and MOSFET gate (arm2)'
- flip:
    at: watch
  note: Flip back
- pick:
    arm: arm3
    item: oled
    from: kit.oled
  note: OLED module presses into its socket
- place:
    arm: arm3
    to: watch.oled
    into: board
    press: 1
- flash:
    at: watch
    firmware: watch_firmware.bin
  note: 'USB-C dock: flash firmware and self-test'
- inspect:
    at: watch.oled
    check: watch_face_shows
  note: Camera checks the watch face
- operator:
    message: Plug the battery into the JST socket and lay it on the back (foam tape). Press START.
    seconds: 30
  note: 'You: plug in the battery (30 s)'
- flip:
    at: watch
  note: Flip to fit the back cover
- tool_change:
    arm: arm4
    tool: spindle
- bit_change:
    arm: arm4
    bit: hex_1_5
- pick:
    arm: arm3
    item: back
    from: kit.board
  note: Back cover (second perfboard) onto its standoffs
- place:
    arm: arm3
    to: watch.back
    into: board
- pick:
    arm: arm1
    item: s1
    from: cup_a
  note: Two M2 screws through the back cover
- place:
    arm: arm1
    to: watch.s1
    into: board
- pick:
    arm: arm1
    item: s2
    from: cup_a
- place:
    arm: arm1
    to: watch.s2
    into: board
- drive:
    arm: arm4
    at:
    - watch.s1
    - watch.s2
    depth: 2
  note: Drive both screws from below
- flip:
    at: watch
  note: Flip back, face up
- tool_change:
    arm: arm1
    tool: gripper_A
- pick:
    arm: arm1
    item: board
    from: watch.board
  note: Finished watch to the tray
- place:
    arm: arm1
    to: finished
- tool_change:
    arm: arm1
    tool: none
- tool_change:
    arm: arm2
    tool: none
- tool_change:
    arm: arm3
    tool: none
- tool_change:
    arm: arm4
    tool: none
