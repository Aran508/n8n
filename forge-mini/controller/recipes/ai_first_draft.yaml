# What an AI agent might write on its first try: the keychain recipe, but it
# asks arm3 (bottom-left) to drop the product in the output tray on the far
# right. The planner rejects it before any servo moves; the agent swaps in
# arm4, which sits next to the tray, and the result is led_keychain.yaml.
product: ai_first_draft
items:
  housing: {kind: housing}            # arrives on the conveyor
  led:     {at: led_tray, kind: led}
  cap:     {at: cap_tray, kind: cap}
steps:
  - conveyor: {item: housing, from: conveyor_start, to: input}
    note: Housing rides the conveyor until the IR sensor sees it
  - pick:  {arm: arm1, item: housing, from: input}
    note: Loader picks the housing
  - place: {arm: arm1, to: fixture}
    note: Loader drops it into the fixture
  - parallel:
      - hold: {arm: arm2, at: fixture.edge}
      - pick: {arm: arm4, item: led, from: led_tray}
    note: Holder clamps the housing while arm4 vacuums up an LED
  - place: {arm: arm4, to: fixture.slot, into: housing}
    note: LED goes into the slot
  - pick:  {arm: arm1, item: cap, from: cap_tray}
    note: Loader fetches the cap
  - place: {arm: arm1, to: fixture.top, into: housing}
    note: Cap sits on top
  - press: {arm: arm3, at: fixture.top, depth: 3}
    note: Tool arm presses the cap home
  - release: {arm: arm2}
    note: Holder lets go
  - inspect: {arm: arm4, at: fixture, check: led_seated}
    note: Wrist camera checks the LED is seated
  - pick:  {arm: arm3, item: housing, from: fixture}
    note: Finished keychain is lifted out
  - place: {arm: arm3, to: output}
    note: ...and dropped in the output tray
